services:
  - type: web
    name: agent-remote
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agent_remote.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: LLM_HOURLY_CAP
        value: "200"
      - key: LLM_API_KEY
        sync: false
